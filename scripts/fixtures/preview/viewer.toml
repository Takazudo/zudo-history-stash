name = "fixture-viewer-production"
main = "./fixture-src/viewer.ts"
compatibility_date = "2026-08-25"
workers_dev = false
preview_urls = true

[observability]
enabled = true

[assets]
directory = "./fixture-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api", "/api/*"]

[[routes]]
pattern = "fixture-viewer.example.com"
custom_domain = true

[[services]]
binding = "STASH"
service = "fixture-stash-production"

[vars]
SOURCE = "production"

[env.staging.vars]
SOURCE = "staging"

[env.preview]
routes = []

[env.preview.vars]
SOURCE = "preview"

[[env.preview.services]]
binding = "STASH"
service = "fixture-stash-preview"
