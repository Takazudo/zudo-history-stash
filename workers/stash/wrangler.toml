name = "zudo-history-stash"
main = "src/index.ts"
compatibility_date = "2026-08-25"
workers_dev = true
preview_urls = true

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

[[routes]]
pattern = "zudo-history-stash.__DOMAIN__"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "zudo-history-stash"
database_id = "REPLACE_ME" # wrangler d1 create zudo-history-stash

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "zudo-history-stash-blobs"

[[durable_objects.bindings]]
name = "STASH_EVENTS"
class_name = "StashEvents"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StashEvents"]

[vars]
ALLOWED_ORIGINS = ""
STASH_DELETE_GRACE_DAYS = "30"
GC_ORPHAN_MIN_AGE_MS = "900000"
GC_CONTENT_MIN_AGE_MS = "86400000"
GC_CHANGE_SET_RETENTION_MS = "2592000000"
GC_LEASE_TTL_MS = "300000"
CHANGE_SET_TTL_DAYS = "14"
STASH_EVENTS_MAX_STREAM_MS = "300000"
JSON_INLINE_MAX_BYTES = "5000000"
D1_INLINE_MAX_BYTES = "524288"
HTTP_REQUEST_MAX_BYTES = "100000000"
SINGLE_UPLOAD_MAX_BYTES = "33554432"
MAX_FILE_BYTES = "100000000"
DIFF_MAX_BYTES = "524288"
MULTIPART_PART_BYTES = "8388608"
MAX_OPEN_UPLOAD_SESSIONS = "8"
MAX_RESERVED_UPLOAD_BYTES = "500000000"
UPLOAD_SESSION_TTL_SECONDS = "86400"

[secrets]
required = ["STASH_ADMIN_TOKEN"]

[[ratelimits]]
name = "RL_READ"
namespace_id = "1101"

[ratelimits.simple]
limit = 600
period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1102"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_DIFF"
namespace_id = "1103"

[ratelimits.simple]
limit = 120
period = 60

[env.preview]
routes = []

[env.preview.triggers]
crons = []

[env.preview.vars]
ALLOWED_ORIGINS = "http://localhost:5173"
STASH_DELETE_GRACE_DAYS = "30"
GC_ORPHAN_MIN_AGE_MS = "900000"
GC_CONTENT_MIN_AGE_MS = "86400000"
GC_CHANGE_SET_RETENTION_MS = "2592000000"
GC_LEASE_TTL_MS = "300000"
CHANGE_SET_TTL_DAYS = "14"
STASH_EVENTS_MAX_STREAM_MS = "300000"
JSON_INLINE_MAX_BYTES = "5000000"
D1_INLINE_MAX_BYTES = "524288"
HTTP_REQUEST_MAX_BYTES = "100000000"
SINGLE_UPLOAD_MAX_BYTES = "33554432"
MAX_FILE_BYTES = "100000000"
DIFF_MAX_BYTES = "524288"
MULTIPART_PART_BYTES = "8388608"
MAX_OPEN_UPLOAD_SESSIONS = "8"
MAX_RESERVED_UPLOAD_BYTES = "500000000"
UPLOAD_SESSION_TTL_SECONDS = "86400"

[env.preview.secrets]
required = ["STASH_ADMIN_TOKEN"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zudo-history-stash-preview"
database_id = "REPLACE_ME"

[[env.preview.r2_buckets]]
binding = "BLOBS"
bucket_name = "zudo-history-stash-blobs-preview"

[[env.preview.durable_objects.bindings]]
name = "STASH_EVENTS"
class_name = "StashEvents"

[[env.preview.migrations]]
tag = "v1"
new_sqlite_classes = ["StashEvents"]

[[env.preview.ratelimits]]
name = "RL_READ"
namespace_id = "1201"

[env.preview.ratelimits.simple]
limit = 600
period = 60

[[env.preview.ratelimits]]
name = "RL_WRITE"
namespace_id = "1202"

[env.preview.ratelimits.simple]
limit = 60
period = 60

[[env.preview.ratelimits]]
name = "RL_DIFF"
namespace_id = "1203"

[env.preview.ratelimits.simple]
limit = 120
period = 60
