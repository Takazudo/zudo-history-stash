name = "zudo-history-stash"
main = "src/index.ts"
compatibility_date = "2026-08-25"
workers_dev = true
preview_urls = true

[observability]
enabled = true

[[routes]]
pattern = "zudo-history-stash.__DOMAIN__"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "zudo-history-stash"
database_id = "REPLACE_ME" # wrangler d1 create zudo-history-stash

[vars]
ALLOWED_ORIGINS = ""

[secrets]
required = ["STASH_ADMIN_TOKEN"]

[[ratelimits]]
name = "RL_READ"
namespace_id = "1101"

[ratelimits.simple]
limit = 600
period = 60

[[ratelimits]]
name = "RL_WRITE"
namespace_id = "1102"

[ratelimits.simple]
limit = 60
period = 60

[[ratelimits]]
name = "RL_DIFF"
namespace_id = "1103"

[ratelimits.simple]
limit = 120
period = 60

[env.preview]
routes = []

[env.preview.vars]
ALLOWED_ORIGINS = "http://localhost:5173"

[env.preview.secrets]
required = ["STASH_ADMIN_TOKEN"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "zudo-history-stash-preview"
database_id = "REPLACE_ME"

[[env.preview.ratelimits]]
name = "RL_READ"
namespace_id = "1201"

[env.preview.ratelimits.simple]
limit = 600
period = 60

[[env.preview.ratelimits]]
name = "RL_WRITE"
namespace_id = "1202"

[env.preview.ratelimits.simple]
limit = 60
period = 60

[[env.preview.ratelimits]]
name = "RL_DIFF"
namespace_id = "1203"

[env.preview.ratelimits.simple]
limit = 120
period = 60
