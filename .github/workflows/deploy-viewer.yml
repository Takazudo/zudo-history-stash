name: Deploy viewer Worker

on:
  push:
    branches:
      - main
    paths:
      - "workers/viewer/**"
      - "packages/core/**"
      - "packages/client/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-viewer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check Cloudflare credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check deploy credentials
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; viewer deployment is skipped."
          fi

  build-deploy:
    name: Build and deploy viewer Worker
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        run: pnpm build:libs

      - name: Build viewer assets
        run: pnpm --filter zudo-history-stash-viewer exec vite build

      - name: Deploy viewer Worker
        working-directory: workers/viewer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env=""

  smoke:
    name: Smoke-test viewer Worker
    needs: build-deploy
    if: needs.build-deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      - name: Smoke-test viewer navigation
        env:
          SMOKE_BASE_URL: ${{ vars.VIEWER_SMOKE_BASE_URL }}
        run: node scripts/smoke.mjs --target viewer
