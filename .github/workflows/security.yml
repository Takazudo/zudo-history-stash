name: Security audit

on:
  pull_request:
    branches:
      - main
      - "base/**"
  push:
    branches:
      - main
      - "base/**"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        env:
          GHSA_ALLOWLIST: ""
        run: |
          set -euo pipefail
          # Critical advisories are never allowlisted. The second audit is
          # the high-severity gate and is the only one that reads this list.
          pnpm audit --prod --audit-level critical
          if [[ -n "$GHSA_ALLOWLIST" ]]; then
            pnpm audit --prod --audit-level high --ignore "$GHSA_ALLOWLIST"
          else
            pnpm audit --prod --audit-level high
          fi
