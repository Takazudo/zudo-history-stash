name: Documentation checks

on:
  pull_request:
    branches:
      - main
      - "base/**"
    paths:
      - "doc/**"
      - "docs/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".mdx-formatter.json"
      - ".github/workflows/doc-checks.yml"
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "docs/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".mdx-formatter.json"
      - ".github/workflows/doc-checks.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Build and check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation aggregate
        run: pnpm b4push:doc
