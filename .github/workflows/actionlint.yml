# Lints GitHub Actions workflow files with rhysd/actionlint.
# Path-filtered: runs ONLY when a workflow or this lint's own config changes,
# so it stays off the critical path for ordinary PRs.
name: actionlint

on:
  pull_request:
    branches:
      - main
      - "base/**"
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - "base/**"
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0

      # The ubuntu-22.04 runner ships shellcheck preinstalled, so actionlint
      # additionally lints run: shell blocks through it (no extra setup).
      - name: Run actionlint
        env:
          # Pinned release + checksum (tamper-evident). Bump both together;
          # checksum from actionlint_<ver>_checksums.txt on the GitHub release.
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
