name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "docs/openapi.json"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".mdx-formatter.json"
      - ".github/workflows/doc-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, validate, and deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.1.0
        with:
          version: 10.32.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run documentation aggregate
        run: pnpm b4push:doc

      - name: Generate published page history
        run: >-
          cd doc && pnpm exec doc-history-generate
          --content-dir src/content/docs
          --locale ja:src/content/docs-ja
          --out-dir dist/doc-history
          --max-entries 50

      - name: Validate deploy without credentials
        run: cd doc && pnpm exec wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Check production credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are incomplete; live documentation deploy skipped."
          fi

      - name: Deploy documentation to production
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd doc && pnpm exec wrangler deploy
